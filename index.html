<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101722">
    <title>FightTimer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="timer-shell" data-mode="ready">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">FT</span>
          <div>
            <p class="eyebrow">Fight night control</p>
            <h1>FightTimer</h1>
          </div>
        </div>
        <div class="live-indicator" id="liveIndicator">
          <span class="live-indicator__dot" aria-hidden="true"></span>
          <span id="statusText">Bereit</span>
        </div>
      </header>

      <section class="settings-card" aria-labelledby="settingsTitle">
        <div class="settings-card__heading">
          <div><p class="eyebrow">Kampf konfigurieren</p><h2 id="settingsTitle">Timer-Einstellungen</h2></div>
          <p>Änderungen gelten nach dem Speichern.</p>
        </div>
        <form class="settings-form" id="settingsForm">
          <fieldset id="settingsFields">
            <legend class="sr-only">Kampfdauer</legend>
            <label><span>Minuten pro Runde</span><input id="roundMinutes" type="number" min="0" max="59" value="2" inputmode="numeric" required></label>
            <label><span>Sekunden</span><input id="roundSeconds" type="number" min="0" max="59" value="0" inputmode="numeric" required></label>
            <label><span>Anzahl der Runden</span><input id="totalRounds" type="number" min="1" max="99" value="3" inputmode="numeric" required></label>
          </fieldset>
          <button class="button button--save" id="saveSettingsButton" type="submit">Einstellungen speichern</button>
        </form>
        <p class="settings-message" id="settingsMessage" role="status"></p>
      </section>

      <section class="clock-card" aria-labelledby="phaseLabel">
        <div class="round-badge">RUNDE <strong id="roundNumber">1</strong> / <strong id="totalRoundsDisplay">3</strong></div>
        <div class="clock-card__content">
          <p class="phase-label" id="phaseLabel">BEREIT FÜR DIE NÄCHSTE RUNDE</p>
          <time class="clock" id="clock" datetime="PT2M" aria-live="off">02:00</time>
          <p class="clock-caption" id="clockCaption">Rundenzeit</p>
        </div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      </section>

      <section class="controls" aria-label="Timer-Steuerung">
        <button class="button button--start" id="startButton" type="button">
          <span class="button__icon" aria-hidden="true">▶</span>
          <span id="startButtonText">Runde starten</span>
        </button>
        <button class="button button--pause" id="pauseButton" type="button" disabled>
          <span class="button__icon" id="pauseIcon" aria-hidden="true">Ⅱ</span>
          <span id="pauseButtonText">Pause</span>
        </button>
        <button class="button button--reset" id="resetButton" type="button">Zurücksetzen</button>
      </section>

      <footer>
        <p><kbd>Leertaste</kbd> Start / nächste Runde</p>
        <p><kbd>P</kbd> Pause</p>
        <p><kbd>Esc</kbd> Zurücksetzen</p>
      </footer>
      <p class="audio-error" id="audioError" role="status"></p>
    </main>
  </body>
</html>
